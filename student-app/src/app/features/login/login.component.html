<div class="login-page">
  <div class="login-brand">
    <mat-icon class="brand-icon">school</mat-icon>
    <h1>Student Internship System</h1>
    <p>Manage your career steps in one place</p>
  </div>

  <mat-card class="login-card mat-elevation-z8">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="login()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Email Address</mat-label>
          <input
            matInput
            formControlName="email"
            type="email"
            placeholder="student@example.com"
          />
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
          >
            <mat-icon>{{
              hidePassword ? "visibility_off" : "visibility"
            }}</mat-icon>
          </button>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="form.invalid"
        >
          SIGN IN
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
