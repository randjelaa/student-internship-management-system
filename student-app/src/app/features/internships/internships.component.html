<h2>Internships</h2>

<div style="display:flex; gap: 16px; margin-bottom: 16px;">

  <!-- SEARCH -->
  <mat-form-field appearance="outline">
    <mat-label>Search</mat-label>
    <input matInput [(ngModel)]="search" (input)="filter()" />
  </mat-form-field>

  <!-- COMPANY FILTER -->
  <mat-form-field appearance="outline">
    <mat-label>Company</mat-label>
    <mat-select [(ngModel)]="companyFilter" (selectionChange)="filter()">
      <mat-option value="">All</mat-option>
      <mat-option *ngFor="let c of companies" [value]="c">
        {{ c }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- TECHNOLOGY FILTER -->
  <mat-form-field appearance="outline">
    <mat-label>Technology</mat-label>
    <mat-select [(ngModel)]="technologyFilter" (selectionChange)="filter()">
      <mat-option value="">All</mat-option>
      <mat-option *ngFor="let t of technologies" [value]="t">
        {{ t }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-button (click)="resetFilters()">Reset</button>

</div>

<table mat-table [dataSource]="filtered" class="mat-elevation-z8">

  <!-- Title -->
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef> Title </th>
    <td mat-cell *matCellDef="let i"> {{ i.title }} </td>
  </ng-container>

  <!-- Company -->
  <ng-container matColumnDef="company">
    <th mat-header-cell *matHeaderCellDef> Company </th>
    <td mat-cell *matCellDef="let i"> {{ i.companyName }} </td>
  </ng-container>

  <!-- Location -->
  <ng-container matColumnDef="location">
    <th mat-header-cell *matHeaderCellDef> Location </th>
    <td mat-cell *matCellDef="let i"> {{ i.location }} </td>
  </ng-container>

  <!-- Status -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> Status </th>
    <td mat-cell *matCellDef="let i">
      {{ getStatus(i.id) }}
    </td>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let i">
      <button
  mat-raised-button
  color="primary"
  (click)="apply(i.id); $event.stopPropagation()"
  [disabled]="hasApplied(i.id)"
>
  Apply
</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns;"
    (click)="openDetails(row.id)"
    style="cursor:pointer"
  ></tr>

</table>
