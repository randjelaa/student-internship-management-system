<div class="page-header">
  <h2>My Active Internships</h2>
</div>

<div class="filters-container">
  <mat-form-field appearance="outline" class="filter-item">
    <mat-label>Search</mat-label>
    <input
      matInput
      [(ngModel)]="search"
      (input)="onSearchInput()"
      placeholder="Search by title..."
    />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-item">
    <mat-label>Company</mat-label>
    <mat-select [(ngModel)]="companyFilter" (selectionChange)="filter()">
      <mat-option value="">All Companies</mat-option>
      @for (c of companies; track c.id) {
        <mat-option [value]="c.id">{{ c.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-item">
    <mat-label>Technology</mat-label>
    <mat-select [(ngModel)]="technologyFilter" (selectionChange)="filter()">
      <mat-option value="">All Technologies</mat-option>
      @for (t of technologies; track t.id) {
        <mat-option [value]="t.id">{{ t.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button color="warn" (click)="resetFilters()">
    <mat-icon>refresh</mat-icon> Reset
  </button>
</div>

<div class="table-container mat-elevation-z8">
  @if (loading) {
    <div class="centered-spinner">
      <mat-spinner diameter="50"></mat-spinner>
    </div>
  } @else {
    <table mat-table [dataSource]="acceptedInternships">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let i"><strong>{{ i.title }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="company">
        <th mat-header-cell *matHeaderCellDef>Company</th>
        <td mat-cell *matCellDef="let i">{{ i.companyName }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let i">
          <button mat-raised-button color="primary" (click)="goToWorkLogs(i.id); $event.stopPropagation()">
            Manage Logs
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['title', 'company', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['title', 'company', 'actions']" (click)="openDetails(row.id)" class="clickable-row"></tr>
    </table>

    <mat-paginator
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    ></mat-paginator>
  }
</div>
