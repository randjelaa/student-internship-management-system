<div style="padding: 24px; max-width: 1000px; margin: 0 auto;">
  <h2>My Active Internships</h2>
  <p>Select an internship to manage your weekly work logs.</p>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px;">
    <mat-card *ngFor="let item of acceptedInternships" class="mat-elevation-z3">
      <mat-card-header>
        <mat-card-title>{{ item.title }}</mat-card-title>
        <mat-card-subtitle>{{ item.companyName }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content style="margin-top: 16px;">
        <p><mat-icon inline>location_on</mat-icon> {{ item.location }}</p>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-raised-button color="primary" (click)="viewDetails(item.id)">
          SEE DETAILS & LOGS
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div *ngIf="acceptedInternships.length === 0" style="text-align: center; margin-top: 50px; color: gray;">
    <p>You don't have any accepted internships yet.</p>
  </div>
</div>
